name: CI Pipeline

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Job for Android build
  build-android:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      # Upgrade system gcc
      - name: Upgrade system gcc
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gcc-16

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: 'yarn'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: |
          npm install -g yarn

      - name: Set up Yarn
        run: |
          yarn install

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Build Android Release
        working-directory: android
        run: |
          yarn build:android:release

      - name: Sign app APK
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apks/release
          signingKeyBase64: ${{ secrets.DROID_KEYSTORE_B64 }}
          alias: ${{ secrets.DROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.DROID_KEYSTORE_PASS }}
          keyPassword: ${{ secrets.DROID_KEY_PASS }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: android/app/build/outputs/apks/release/anythingllm-universal-signed.apk
