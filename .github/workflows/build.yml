name: CI Pipeline

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Job for Android build
  build-android:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      # Upgrade system gcc
      - name: Upgrade system gcc
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gcc-16

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: 'yarn'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: |
          npm install -g yarn

      - name: Set up Yarn
        run: |
          yarn install

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      # llama.rn builds with CMake 3.22.1; make sure that exact package (and its
      # ninja) is installed and runnable before Gradle tries to use it.
      - name: Ensure Android CMake 3.22.1 + ninja
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "cmake;3.22.1"
          ls -l "$SDK/cmake/"
          file "$SDK/cmake/3.22.1/bin/ninja"
          "$SDK/cmake/3.22.1/bin/ninja" --version
          "$SDK/cmake/3.22.1/bin/cmake" --version

      - name: Build Android Release
        working-directory: android
        run: |
          yarn build:android:release

      # Secrets aren't available to PRs from forks, so signing and uploading are
      # skipped there (the unsigned build above still verifies that it compiles).
      - name: Sign app APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apks
          signingKeyBase64: ${{ secrets.DROID_KEYSTORE_B64 }}
          alias: ${{ secrets.DROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.DROID_KEYSTORE_PASS }}
          keyPassword: ${{ secrets.DROID_KEY_PASS }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload Android APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: android/app/build/outputs/apks/anythingllm-universal-signed.apk
