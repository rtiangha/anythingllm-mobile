buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 34
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "30.0.16248370"
        kotlinVersion = "2.1.21"
        objectboxVersion = "4.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("io.objectbox:objectbox-gradle-plugin:$objectboxVersion")
        // Add the Google Services plugin dependency
        // This is used exclusively for Firebase functionality
        classpath 'com.google.gms:google-services:4.4.4'
        // Crashlytics: uploads the mapping/native symbol info crash reports are decoded with
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
    }
}

apply plugin: "com.facebook.react.rootproject"
